{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>POSTIFY</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        .navbar{
            background:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px 50px;
            border-bottom:1px solid #ddd;
        }

        .logo{
            text-decoration:none;
            color:black;
            font-size:28px;
            font-weight:bold;
        }

        .nav-links{
            display:flex;
            gap:15px;
            align-items:center;
        }

        .nav-links a{
            text-decoration:none;
            padding:10px 18px;
            border-radius:8px;
            transition:.3s;
        }

        .home-btn{
            background:#222;
            color:white;
        }

        .profile-btn{
            background:#0d6efd;
            color:white;
        }

        .login-btn{
            background:green;
            color:white;
        }

        .logout-btn{
            background:red;
            color:white;
        }

        .nav-links a:hover{
            opacity:.8;
        }

        .main-content{
            padding:20px;
        }

    </style>

    {% block head %}
    {% endblock head %}

</head>

<body>

    <nav class="navbar">

        <a href="/" class="logo">
            POSTIFY
        </a>

        <div class="nav-links">

            <a href="/" class="home-btn">
                Home
            </a>

            {% if user.is_authenticated %}

            <a href="/profile/" class="profile-btn">
                Profile
            </a>

            <a href="/logout/" class="logout-btn">
                Logout
            </a>

            {% else %}

            <a href="/login/" class="login-btn">
                Login
            </a>

            {% endif %}

        </div>

    </nav>

    <div class="main-content">

        {% block content %}
        {% endblock content %}

    </div>

</body>
</html>
