{% extends 'base/base.html' %}
{% block head %}
<title>POSTIFY | Delete Post</title>

<style>
body{
    background:#14131b;
    font-family:Arial, Helvetica, sans-serif;
}

.delete-box{
    width:450px;
    margin:120px auto;
    padding:35px;
    background:rgba(31,29,43,.95);
    border-radius:22px;
    border:1px solid rgba(255,255,255,.06);
    backdrop-filter:blur(15px);
    box-shadow:0 8px 30px rgba(138,71,214,.15);
    text-align:center;
}

.delete-box h2{
    margin-bottom:18px;
    font-size:30px;
    font-weight:700;
    background:linear-gradient(135deg,#0e67b8,#8a47d6,#e155a8,#ff9567);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.delete-box p{
    color:#d5d5d5;
    font-size:17px;
    line-height:1.6;
    margin-bottom:30px;
}

.delete-box form{
    display:flex;
    justify-content:center;
    gap:15px;
}

.delete-btn,
.cancel-btn{
    padding:13px 28px;
    border:none;
    border-radius:12px;
    text-decoration:none;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.delete-btn{
    color:#fff;
    background:linear-gradient(135deg,#ff4d4d,#ff1f1f);
}

.delete-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(255,0,0,.35);
}

.cancel-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:#3b3b4d;
}

.cancel-btn:hover{
    background:#55556d;
    transform:translateY(-3px);
}

@media(max-width:500px){

    .delete-box{
        width:90%;
        padding:25px;
    }

    .delete-box form{
        flex-direction:column;
    }

    .delete-btn,
    .cancel-btn{
        width:100%;
    }

}
</style>

{% endblock %}
{% block content %}

<div class="delete-box">

    <h2>Delete Post</h2>

    <p>Are you sure you want to delete this post?</p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="delete-btn">
            Yes, Delete
        </button>

        <a href="{% url "home" %}" class="cancel-btn">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
