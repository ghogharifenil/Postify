{% extends 'base/base.html' %}
{% load static %}

{% block head %}
  <title>POSTIFY | Create Post</title>
  <link rel="stylesheet" href="{% static 'css/create_post.css' %}" />
  <style>
    .image-preview{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:15px;
}

.preview-box{
    position:relative;
    width:120px;
    height:120px;
    border-radius:12px;
    overflow:hidden;
    border:2px solid #444;
}

.preview-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.remove-preview{
    position:absolute;
    top:5px;
    right:5px;
    width:24px;
    height:24px;
    border:none;
    border-radius:50%;
    background:#ff3040;
    color:white;
    cursor:pointer;
    font-size:14px;
}
  </style>
{% endblock %}

{% block content %}
  <div class="create-container">
    <h2 class="create-title">Create New Post</h2>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-group">
        <label>Post Title</label>
        <input type="text" name="title" class="form-control" required />
      </div>

      <div class="form-group">
        <label>Post Content</label>
        <textarea name="content" class="form-control" required></textarea>
      </div>

      <div class="form-group">
        <label>Select Images</label>

        <input type="file" id="images" name="images" accept="image/*" multiple />

        <small>You can select multiple images (Ctrl + Click)</small>
      </div>

      <div id="preview" class="image-preview"></div>

      <button class="post-btn" type="submit">
        <i class="fa-solid fa-paper-plane"></i>
        Publish Post
      </button>
    </form>
  </div>

  <script>
    const input = document.getElementById('images')
    const preview = document.getElementById('preview')
    
    input.addEventListener('change', function () {
      preview.innerHTML = ''
    
      Array.from(this.files).forEach(function (file) {
        const reader = new FileReader()
    
        reader.onload = function (e) {
          const div = document.createElement('div')
          div.className = 'preview-box'
    
          const img = document.createElement('img')
          img.src = e.target.result
    
          div.appendChild(img)
          preview.appendChild(div)
        }
    
        reader.readAsDataURL(file)
      })
    })
  </script>
{% endblock %}
