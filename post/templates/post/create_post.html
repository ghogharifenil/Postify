{% extends 'base/base.html' %}
{% load static %}

{% block head %}

<title>POSTIFY | Create Post</title>

<style>

body{
background:#27262E;
}

/* CONTAINER */

.create-container{

max-width:700px;
margin:auto;

background:#32313B;

padding:35px;

border-radius:25px;

box-shadow:
0 10px 35px rgba(0,0,0,.35);

color:white;

}

/* TITLE */

.create-title{

text-align:center;

font-size:30px;

font-weight:700;

margin-bottom:25px;

color:#E19C63;

}

/* FORM */

.form-group{

margin-bottom:20px;

}

.form-group label{

display:block;

margin-bottom:8px;

font-weight:700;

font-size:16px;

color:#d8d8d8;

}

/* INPUT */

.form-control{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:15px;

background:#27262E;

color:white;

font-size:15px;

transition:.4s;

box-sizing:border-box;

}

/* PLACEHOLDER */

.form-control::placeholder{

color:#999;

}

/* FOCUS */

.form-control:focus{

box-shadow:
0 0 0 3px rgba(139,165,190,.4);

transform:scale(1.01);

border:1px solid #8BA5BE;

}

/* TEXTAREA */

textarea.form-control{

resize:none;

height:200px;

}

/* FILE INPUT */

input[type=file]{

padding:12px;
cursor:pointer;

}

/* BUTTON */

.post-btn{

width:100%;

padding:15px;

border:none;

border-radius:15px;

cursor:pointer;

font-size:16px;

font-weight:700;

color:white;

background:linear-gradient(
135deg,
#E19C63,
#8BA5BE
);

transition:.4s;

}

/* BUTTON HOVER */

.post-btn:hover{

transform:translateY(-4px);

box-shadow:
0 8px 25px rgba(0,0,0,.35);

}

/* ICON */

.post-btn i{

margin-right:8px;

}

</style>

{% endblock %}


{% block content %}

<div class="create-container">

<h2 class="create-title">
Create New Post
</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="form-group">

<label>
Post Title
</label>

<input
type="text"
name="title"
class="form-control"
required
>

</div>


<div class="form-group">

<label>
Post Content
</label>

<textarea
name="content"
class="form-control"
required
></textarea>

</div>


<div class="form-group">

<label>
Upload Image
</label>

<input
type="file"
name="image"
class="form-control"
accept="image/*"
>

</div>


<button
type="submit"
class="post-btn">
<i class="fa-solid fa-paper-plane"></i>
Publish Post

</button>

</form>

</div>

{% endblock %}
