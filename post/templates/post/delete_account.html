{% extends 'base/base.html' %}

{% block head %}
<title>POSTIFY | Delete Account</title>

<style>
body{

background:#14131B;

}


/* CONTAINER */

.box{

max-width:500px;

margin:80px auto;

padding:40px;

text-align:center;

color:white;

background:rgba(31,29,43,.95);

border-radius:25px;

border:1px solid rgba(255,255,255,.05);

backdrop-filter:blur(15px);

box-shadow:
0 8px 30px rgba(138,71,214,.15);

}


/* TITLE */

h1{

font-size:36px;

margin-bottom:20px;

background:
linear-gradient(
135deg,
#E155A8,
#FF9567
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}


/* DESCRIPTION */

p{

color:#B8B8C8;

line-height:1.8;

font-size:16px;

}


/* BUTTON AREA */

.btn-area{

margin-top:30px;

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

}


/* COMMON BUTTON */

.btn{

padding:13px 20px;

border:none;

border-radius:14px;

cursor:pointer;

font-weight:700;

font-size:15px;

text-decoration:none;

color:white;

transition:.4s;

}


/* DELETE BUTTON */

.delete{

background:
linear-gradient(
135deg,
#E155A8,
#FF9567
);

}


/* CANCEL BUTTON */

.cancel{

background:
linear-gradient(
135deg,
#0E67B8,
#8A47D6
);

display:flex;

align-items:center;

justify-content:center;

}


/* HOVER */

.btn:hover{

transform:translateY(-4px);

box-shadow:
0 10px 25px rgba(225,85,168,.35);

}


/* MOBILE */

@media(max-width:600px){

.box{

margin:40px auto;

padding:25px;

}

h1{

font-size:28px;

}

.btn-area{

flex-direction:column;

}

.btn{

width:100%;

}

}
</style>
{% endblock %}

{% block content %}

<div class="box">

    <h1>Delete Account?</h1>

    <p>
        This action is permanent.<br>
        All your posts, profile data and settings will be deleted.
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="btn-area">

            <button type="submit" class="btn delete">
                Yes, Delete
            </button>

            <a href="/profile/" class="btn cancel">
                Cancel
            </a>

        </div>
    </form>

</div>

{% endblock %}
