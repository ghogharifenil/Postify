{% extends 'base/base.html' %}
{% load static %}

{% block head %}
<title>POSTIFY | Edit Profile</title>

<style>

.edit-container{

max-width:700px;
margin:auto;

}

.edit-box{

background:#32313B;

padding:35px;

border-radius:25px;

box-shadow:
0 8px 30px rgba(0,0,0,.35);

}

/* HEADER */

.edit-header{

text-align:center;
margin-bottom:30px;

}

.edit-header h1{

color:#E19C63;

font-size:38px;

margin-bottom:10px;

}

.edit-header p{

color:#aaa;

}

/* PROFILE IMAGE */

.preview-container{

position:relative;

width:130px;

margin:auto;
margin-bottom:35px;

}

.preview{

width:130px;
height:130px;

border-radius:50%;

overflow:hidden;

border:4px solid #E19C63;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(
135deg,
#E19C63,
#8BA5BE
);

}

.preview img{

width:100%;
height:100%;

object-fit:cover;

}

/* CAMERA BUTTON */

.circle-btn{

position:absolute;

bottom:0;
right:0;

width:40px;
height:40px;

border-radius:50%;

display:flex;

justify-content:center;
align-items:center;

cursor:pointer;

background:linear-gradient(
135deg,
#E19C63,
#8BA5BE
);

color:white;

font-size:15px;

border:3px solid #32313B;

transition:.3s;

}

.circle-btn:hover{

transform:scale(1.1);

}

/* INPUTS */

.input-group{

margin-bottom:20px;

}

.input-group label{

display:block;

margin-bottom:8px;

font-weight:600;

color:#ddd;

}

.input-group label i{

margin-right:8px;

color:#E19C63;

}

.input-group input,
.input-group textarea{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:15px;

background:#27262E;

color:white;

font-size:15px;

}

.input-group textarea{

height:120px;

resize:none;

}

/* BUTTONS */

.btn-group{

display:flex;

gap:15px;

margin-top:25px;

}

.save-btn,
.cancel-btn{

flex:1;

padding:15px;

border:none;

border-radius:15px;

text-decoration:none;

text-align:center;

font-size:16px;
font-weight:bold;

cursor:pointer;

color:white;

transition:.3s;

}

/* SAVE */

.save-btn{

background:linear-gradient(
135deg,
#E19C63,
#8BA5BE
);

}

/* CANCEL */

.cancel-btn{

background:linear-gradient(
135deg,
#D41F26,
#ff5757
);

}

.save-btn:hover,
.cancel-btn:hover{

transform:translateY(-4px);

}

</style>
{% endblock %}



{% block content %}

<div class="edit-container">

<div class="edit-box">

<div class="edit-header">

<h1>Edit Profile</h1>

<p>

Update your profile information

</p>

</div>

<form method="POST"
enctype="multipart/form-data">

{% csrf_token %}


<div class="preview-container">

<div class="preview">

{% if profile.profile_pic %}

<img
id="preview-image"
src="{{profile.profile_pic.url}}">

{% else %}

<img
id="preview-image"
src="{% static 'images/default.png' %}">

{% endif %}

</div>

<label
for="profile-input"
class="circle-btn">

<i class="fa-solid fa-camera"></i>

</label>

</div>


<input
type="file"
name="profile_pic"
id="profile-input"
hidden>


<!-- NAME -->

<div class="input-group">

<label>

<i class="fa-solid fa-user"></i>

Name

</label>

<input
type="text"
name="name"
value="{{profile.name}}"
placeholder="Enter your name"
required>

</div>


<!-- CITY -->

<div class="input-group">

<label>

<i class="fa-solid fa-location-dot"></i>

City

</label>

<input
type="text"
name="city"
value="{{profile.city}}"
placeholder="Enter your city">

</div>


<!-- BIO -->

<div class="input-group">

<label>

<i class="fa-solid fa-pen"></i>

Bio

</label>

<textarea
name="bio"
placeholder="Write something about yourself...">{{profile.bio}}</textarea>

</div>


<div class="btn-group">

<button
type="submit"
class="save-btn">

Save Changes

</button>


<a
href="{% url 'profile' %}"
class="cancel-btn">

Cancel

</a>

</div>

</form>

</div>

</div>



<script>

let input=
document.getElementById(
"profile-input"
);

input.addEventListener(
"change",
function(){

let file=
this.files[0];

if(file){

let reader=
new FileReader();

reader.onload=
function(e){

document.getElementById(
"preview-image"
).src=
e.target.result;

}

reader.readAsDataURL(
file
);

}

}
);

</script>

{% endblock %}
