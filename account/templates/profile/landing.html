{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSTIFY</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

/* BACKGROUND */
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#1e1e2f,#2c2c44);
}

/* MAIN CARD */
.container{
width:420px;
padding:40px;
text-align:center;
background:rgba(255,255,255,0.05);
backdrop-filter: blur(12px);
border-radius:25px;
box-shadow:0 20px 60px rgba(0,0,0,0.4);
border:1px solid rgba(255,255,255,0.08);
}

/* LOGO */
.logo img{
width:95px;
height:95px;
border-radius:22px;
object-fit:cover;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.logo-text{
font-size:36px;
font-weight:800;
margin-top:15px;
letter-spacing:1px;
color:white;
}

.logo-text span{
color:#E19C63;
}

/* TAGLINE */
.tagline{
margin-top:10px;
font-size:14px;
color:#cfcfcf;
line-height:1.6;
}

/* BUTTONS */
.buttons{
margin-top:30px;
display:flex;
flex-direction:column;
gap:14px;
}

.btn{
text-decoration:none;
padding:13px;
border-radius:14px;
font-weight:600;
font-size:15px;
transition:0.3s;
display:block;
}

/* LOGIN BUTTON */
.login{
background:#4a6cf7;
color:white;
box-shadow:0 10px 20px rgba(74,108,247,0.3);
}

.login:hover{
transform:translateY(-3px);
background:#3a57d6;
}

/* REGISTER BUTTON */
.register{
background:#E19C63;
color:#1a1a1a;
box-shadow:0 10px 20px rgba(225,156,99,0.25);
}

.register:hover{
transform:translateY(-3px);
opacity:0.9;
}

/* FOOTER */
.footer-text{
margin-top:25px;
font-size:12px;
color:#aaa;
}

</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo">
        <img src="{% static 'img/web3.png' %}" alt="POSTIFY Logo">
    </div>

    <!-- TITLE -->
    <div class="logo-text">
        POST<span>IFY</span>
    </div>

    <!-- TAGLINE -->
    <div class="tagline">
        Share your thoughts, connect with friends<br>
        and explore what’s happening around you.
    </div>

    <!-- BUTTONS -->
    <div class="buttons">
        <a href="{% url 'login' %}" class="btn login">Login</a>
        <a href="{% url 'register' %}" class="btn register">Create Account</a>
    </div>

    <!-- FOOTER -->
    <div class="footer-text">
        Made with ❤️ by Fenil
    </div>

</div>

</body>
</html>
