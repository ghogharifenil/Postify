{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSTIFY</title>
<link rel="icon" type="image/png"
          href="{% static 'images/weblogo.png' %}">
          <style>
/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;   /* Scrollbar બંધ */
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e1e2f,#2c2c44);
    font-family:"Segoe UI",sans-serif;
}

/* =========================
   CARD
========================= */

.container{
    width:100%;
    max-width:420px;
    padding:35px 28px;
    text-align:center;

    background:rgba(255,255,255,.05);
    backdrop-filter:blur(12px);

    border-radius:24px;
    border:1px solid rgba(255,255,255,.08);

    box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.container{
    width:min(420px,90vw);
    max-height:90vh;   /* Screen કરતાં મોટું નહીં થાય */
    padding:30px 25px;
    overflow:hidden;
}
/* =========================
   IMAGES
========================= */

img{
    max-width:100%;
    height:auto;
    display:block;
}

.logo{
    display:flex;
    justify-content:center;
    margin-bottom:18px;
}

.logo img{
    width:90px;
    height:90px;
    object-fit:contain;
}

.logo-text{
    display:flex;
    justify-content:center;
    margin-bottom:15px;
}

.logo-img{
    width:100%;
    max-width:260px;
    object-fit:contain;
}

/* =========================
   TAGLINE
========================= */

.tagline{
    color:#d4d4d4;
    font-size:14px;
    line-height:1.6;
}

/* =========================
   BUTTONS
========================= */

.buttons{
    display:flex;
    flex-direction:column;
    gap:15px;
    margin-top:28px;
}

.btn{
    width:100%;
    padding:14px;
    border-radius:14px;
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    transition:.3s;
}

.login{
    background:#4a6cf7;
    color:#fff;
}

.login:hover{
    background:#3559e5;
}

.register{
    background:#E19C63;
    color:#1b1b1b;
}

.register:hover{
    opacity:.9;
}

/* =========================
   FOOTER
========================= */

.footer-text{
    margin-top:24px;
    color:#aaa;
    font-size:12px;
}

/* =========================
   TABLET
========================= */

@media(max-width:768px){

.container{
    max-width:400px;
    padding:30px 24px;
}

.logo img{
    width:80px;
    height:80px;
}

.logo-img{
    max-width:220px;
}

.tagline{
    font-size:13px;
}

}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

body{
    padding:15px;
}

.container{
    padding:24px 18px;
    border-radius:20px;
}

.logo img{
    width:70px;
    height:70px;
}

.logo-img{
    max-width:180px;
}

.tagline{
    font-size:12px;
}

.btn{
    padding:13px;
    font-size:14px;
}

.footer-text{
    font-size:11px;
}

}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:360px){

body{
    padding:10px;
}

.container{
    padding:20px 15px;
}

.logo img{
    width:60px;
    height:60px;
}

.logo-img{
    max-width:150px;
}

.tagline{
    font-size:11px;
}

.btn{
    padding:12px;
    font-size:13px;
}

.footer-text{
    font-size:10px;
}

}
</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo">
        <img src="{% static 'img/weblogo1.png' %}" alt="POSTIFY Logo">
    </div>

    <!-- TITLE -->
    <div class="logo-text">
        <img src="{% static 'images/logo1.png' %}" alt="POSTIFY Logo" class="logo-img">
    </div>

    <!-- TAGLINE -->
    <div class="tagline">
        Share your thoughts, connect with friends<br>
        and explore what’s happening around you.
    </div>

    <!-- BUTTONS -->
    <div class="buttons">
        <a href="{% url 'login' %}" class="btn login">Login</a>
        <a href="{% url 'register' %}" class="btn register">Create Account</a>
    </div>

    <!-- FOOTER -->
    <div class="footer-text">
        Made with ❤️ by Fenil
    </div>

</div>

</body>
</html>
