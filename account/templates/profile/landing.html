{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSTIFY</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#eef2f7,#dfe9f3);
}

/* MAIN BOX */
.container{
text-align:center;
max-width:420px;
padding:30px;
}

/* LOGO */
.logo img{
width:90px;
height:90px;
object-fit:cover;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.logo-text{
font-size:34px;
font-weight:800;
margin-top:15px;
letter-spacing:1px;
}

.logo-text span{
color:#4a6cf7;
}

/* TAGLINE */
.tagline{
margin-top:10px;
font-size:15px;
color:#666;
line-height:1.6;
}

/* BUTTONS */
.buttons{
margin-top:25px;
display:flex;
flex-direction:column;
gap:12px;
}

.btn{
text-decoration:none;
padding:12px;
border-radius:12px;
font-weight:600;
transition:.3s;
font-size:15px;
}

/* LOGIN */
.login{
background:#4a6cf7;
color:white;
}

.login:hover{
background:#3a57d6;
transform:scale(1.03);
}

/* REGISTER */
.register{
background:#111;
color:white;
}

.register:hover{
opacity:0.85;
transform:scale(1.03);
}

/* SMALL FOOTER TEXT */
.footer-text{
margin-top:20px;
font-size:12px;
color:gray;
}

</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo">
        <img src="{% static 'img/web3.png' %}" alt="POSTIFY Logo">
    </div>

    <!-- APP NAME -->
    <div class="logo-text">
        POST<span>IFY</span>
    </div>

    <!-- TAGLINE -->
    <div class="tagline">
        Share your thoughts, connect with friends,<br>
        and explore what’s happening around you.
    </div>

    <!-- BUTTONS -->
    <div class="buttons">

        <a href="{% url 'login' %}" class="btn login">Login</a>

        <a href="{% url 'register' %}" class="btn register">Create Account</a>

    </div>

    <div class="footer-text">
        Made with ❤️ using Django
    </div>

</div>

</body>
</html>
