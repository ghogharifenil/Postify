{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png"
          href="{% static 'images/weblogo1.png' %}">
    
    
        
<title>Postify | Login</title>

<style>
/* BACKGROUND */

body{
    font-family:"Segoe UI",sans-serif;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(
        135deg,
        #1e1e2f,
        #2c2c44
    );
}


/* LOGIN CARD */

.box{
    width:100%;
    max-width:400px;
    padding:40px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(14px);
    border-radius:25px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    transition:.3s;
    text-align:center;
}

.box:hover{
    transform:translateY(-5px);
}


/* HEADING */

h2{
    font-size:30px;
    font-weight:800;
    color:#fff;
    margin-bottom:10px;
}


/* SUBTITLE */

.sub{
    font-size:14px;
    color:#bdbdbd;
    margin-bottom:25px;
    line-height:1.5;
}


/* INPUTS */

input{
    width:100%;
    padding:14px 16px;
    margin:10px 0;
    border:none;
    border-radius:14px;
    font-size:14px;
    outline:none;
    background:rgba(255,255,255,.08);
    color:#fff;
    transition:.3s;
    box-sizing:border-box;
}

input::placeholder{
    color:rgba(255,255,255,.55);
}

input:focus{
    background:rgba(255,255,255,.15);
    box-shadow:0 0 0 3px rgba(74,108,247,.35);
}


/* BUTTON */

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:14px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(
        135deg,
        #4a6cf7,
        #6a11cb
    );
    color:#fff;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(74,108,247,.35);
}


/* ERROR */

.error{
    background:rgba(255,0,0,.15);
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:13px;
    color:#ffb3b3;
}


/* FOOTER */

.helper{
    margin-top:20px;
    font-size:13px;
    color:#bdbdbd;
    line-height:1.5;
}

.helper a{
    color:#E19C63;
    text-decoration:none;
    font-weight:700;
    transition:.3s;
}

.helper a:hover{
    color:#fff;
}


/* ========================= */
/* TABLET */
/* ========================= */

@media (max-width:768px){

    body{
        padding:20px;
    }

    .box{
        max-width:420px;
        padding:35px 28px;
    }

    h2{
        font-size:28px;
    }

    .sub{
        font-size:13px;
    }
}


/* ========================= */
/* MOBILE */
/* ========================= */

@media (max-width:480px){

    body{
        padding:15px;
    }

    .box{
        width:100%;
        padding:28px 20px;
        border-radius:20px;
    }

    h2{
        font-size:24px;
    }

    .sub{
        font-size:12px;
        margin-bottom:20px;
    }

    input{
        padding:13px 14px;
        font-size:14px;
    }

    button{
        padding:13px;
        font-size:14px;
    }

    .helper{
        font-size:12px;
    }

    .error{
        font-size:12px;
    }
}


/* ========================= */
/* SMALL MOBILE */
/* ========================= */

@media (max-width:320px){

    .box{
        padding:22px 15px;
    }

    h2{
        font-size:22px;
    }

    .sub{
        font-size:11px;
    }

    input{
        padding:12px;
        font-size:13px;
    }

    button{
        padding:12px;
        font-size:13px;
    }

    .helper{
        font-size:11px;
    }
}
</style>

          
</head>

<body>

<div class="box">

<h2>Welcome Back</h2>

<div class="sub">
Login to continue to POSTIFY
</div>

{% if error %}
<p class="error">{{error}}</p>
{% endif %}

<form method="POST">

{% csrf_token %}

<input 
type="text"
name="username"
placeholder="Username"
required
>

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit">
Login
</button>

</form>

<div class="helper">
Don't have an account?
<a href="{% url 'register' %}">
Create Account
</a>
</div>

</div>

</body>
</html>
