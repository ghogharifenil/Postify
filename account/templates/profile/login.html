{% extends "Ac_base/ACbase.html" %}
{% load static %}

{% block head %}
<title>Postify | Login</title>

<style>
/* background */

body{
font-family:"Segoe UI",sans-serif;

background:linear-gradient(
135deg,
#4facfe,
#00f2fe,
#6a11cb
);

margin:0;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;
}


/* login box */

.box{

width:400px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(18px);

padding:35px;

border-radius:25px;

border:1px solid rgba(255,255,255,.2);

box-shadow:
0 10px 40px rgba(0,0,0,.2);

transition:.4s;

}

.box:hover{

transform:translateY(-6px);

box-shadow:
0 15px 45px rgba(0,0,0,.3);

}


/* heading */

h2{

text-align:center;

margin-bottom:25px;

font-size:30px;

font-weight:800;

color:white;

}


/* inputs */

input{

width:100%;

padding:14px 16px;

margin:12px 0;

border:none;

border-radius:14px;

font-size:14px;

outline:none;

background:rgba(255,255,255,.2);

color:white;

transition:.4s;

}


/* placeholder */

input::placeholder{

color:rgba(255,255,255,.75);

}


/* focus */

input:focus{

background:white;

color:#333;

box-shadow:
0 0 0 4px rgba(255,255,255,.3);

}


/* button */

button{

width:100%;

padding:14px;

margin-top:20px;

border:none;

border-radius:14px;

font-size:15px;

font-weight:700;

cursor:pointer;

background:linear-gradient(
135deg,
#ff512f,
#dd2476
);

color:white;

transition:.4s;

}


button:hover{

transform:translateY(-3px);

box-shadow:
0 12px 25px rgba(221,36,118,.4);

}


/* error */

.error{

background:rgba(255,0,0,.15);

padding:10px;

border-radius:10px;

margin-bottom:15px;

text-align:center;

color:white;

font-size:14px;

}


/* helper */

.helper{

text-align:center;

font-size:14px;

color:rgba(255,255,255,.85);

margin-top:18px;

}


.helper a{

color:#ffcc70;

font-weight:700;

text-decoration:none;

transition:.3s;

}

.helper a:hover{

color:white;

text-decoration:underline;

}


/* responsive */

@media(max-width:500px){

.box{

width:90%;
padding:25px;

}

}
</style>

{% endblock head %}

{% block content %}

<div class="box">

    <h2>Welcome Back</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username">

        <input type="password" name="password" placeholder="Password">

        <button type="submit">Login</button>
    </form>

    <div class="helper">
        Don’t have an account? <a href="{% url 'register' %}">Create one</a>
    </div>

</div>

{% endblock content %}
