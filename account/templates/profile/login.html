{% extends "Ac_base/ACbase.html" %}
{% load static %}

{% block head %}
<title>Postify | Login</title>

<style>

/* background */
body{
    font-family:"Segoe UI",sans-serif;
    background:linear-gradient(135deg,#eef2f7,#dfe9f3);
    margin:0;
}

/* login box */
.box{
    width:380px;
    margin:90px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    transition:.3s;
}

.box:hover{
    transform:translateY(-3px);
}

/* heading */
h2{
    text-align:center;
    margin-bottom:20px;
    font-size:26px;
    color:#222;
}

/* inputs */
input{
    width:100%;
    padding:12px 14px;
    margin:10px 0;
    border:1px solid #e3e3e3;
    border-radius:12px;
    font-size:14px;
    outline:none;
    background:#fafafa;
    transition:.3s;
}

input:focus{
    border-color:#4a6cf7;
    background:white;
    box-shadow:0 0 0 3px rgba(74,108,247,0.1);
}

/* button */
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:linear-gradient(135deg,#4a6cf7,#6a5af9);
    color:white;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.02);
    box-shadow:0 8px 20px rgba(74,108,247,0.3);
}

/* error */
.error{
    color:#ff3b3b;
    font-size:13px;
    text-align:center;
    margin-bottom:10px;
}

/* helper text */
.helper{
    text-align:center;
    font-size:12px;
    color:gray;
    margin-top:15px;
}

.helper a{
    color:#4a6cf7;
    text-decoration:none;
    font-weight:600;
}

.helper a:hover{
    text-decoration:underline;
}

</style>

{% endblock head %}

{% block content %}

<div class="box">

    <h2>Welcome Back</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username">

        <input type="password" name="password" placeholder="Password">

        <button type="submit">Login</button>
    </form>

    <div class="helper">
        Don’t have an account? <a href="{% url 'register' %}">Create one</a>
    </div>

</div>
